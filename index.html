<!doctype html><html lang="en"><meta charset="utf-8"><title>Audio player demo</title><style>body{background:#e9edf1;margin:50px;font-family:system-ui}main{display:flex;gap:30px}label{display:block;margin-bottom:20px}input{width:400px}</style><h1>Audio player demo</h1><p>Enter an audio URL, or load enriched tracks JSON. Audio stays on its original host.</p><label>Audio URL <input id="url"><button id="load">Load and play</button></label><label>Enriched JSON <input id="file" type="file" accept="application/json"></label><main><compact-audio-player id="player"></compact-audio-player><compact-audio-player id="light" theme="light"></compact-audio-player></main><script type="module">import './src/register.ts'; await customElements.whenDefined('compact-audio-player'); const samples=await(await fetch('/tracks.json')).json(); samples.forEach(t=>t.url='/fixture.mp3'); document.querySelector('#player').playlist=samples; document.querySelector('#light').playlist=samples; setTimeout(()=>document.querySelector('#light').shadowRoot?.querySelectorAll('.switch button')[1]?.click(),100);const player=document.querySelector('#player');document.querySelector('#load').onclick=()=>player.track={title:'Selected track',url:document.querySelector('#url').value};document.querySelector('#file').onchange=async e=>{const data=JSON.parse(await e.target.files[0].text());player.playlist=data};</script></html>
